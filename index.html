.btc{display:flex;align-items:center;gap:10px;border:1px solid #2a1a52;border-radius:18px;padding:12px;background:#0b0716}
.bi{width:30px;height:30px;border-radius:50%;background:#f7931a;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
@media(max-height:860px){.prem{display:none}}
@media(max-height:700px){.btc{display:none}}
.mcol{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px 6px}
.srch{position:relative;flex:1;max-width:540px}
.srch input{width:100%;padding:13px 16px 13px 46px;border-radius:16px;background:#0b0716;border:1px solid #2a1a52;margin:0}
.srch>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#120b22;border:1px solid var(--line);border-radius:16px;padding:8px;z-index:40;max-height:360px;overflow:auto}
.sh{padding:6px 10px;font-size:12px}
.sri{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}.sri:hover{background:var(--card2)}
.top .sp{flex:1}
.bell,.mebtn{position:relative;background:none;display:flex;align-items:center;gap:6px;padding:6px;line-height:0}
.bell i{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 4px;line-height:1}
.top .av{width:40px;height:40px;font-size:16px}
.mmenu{position:absolute;right:22px;top:64px;background:#120b22;border:1px solid var(--line);border-radius:16px;padding:8px;z-index:40;min-width:190px}
.mmenu button{display:block;width:100%;text-align:left;background:none;padding:10px 12px;border-radius:10px}.mmenu button:hover{background:var(--card2)}
#main{flex:1;min-height:0}
#main.chatm{display:flex;flex-direction:column}
.cw{width:100%;height:auto;flex:1;min-height:0}
.tw{max-width:1120px;margin:auto}
.thero{position:relative;display:flex;align-items:center;gap:24px;padding:30px 34px;border-radius:26px;border:1px solid #5a33b5;overflow:hidden;background:linear-gradient(115deg,#170a35,#26105a 55%,#0d0620);margin-bottom:18px;min-height:250px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:22px}
.tcard{background:#0b0716;border:1px solid #2a1a52;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-3px)}.tcard.sel{border-color:#a855f7;box-shadow:0 0 28px #7c3aed55}
.trow{display:flex;gap:12px;align-items:center}.av.tav{width:58px;height:58px;font-size:22px}
.pill{align-self:center;padding:6px 18px;border-radius:99px;background:#2a1a52;color:#cbbff0;font-size:13px}
.tdesc{color:#e6dcff;line-height:1.45;min-height:44px;font-size:14px}.tst{display:flex;gap:8px;align-items:center}
.tb{width:100%;padding:12px;border-radius:12px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:700}
.tlow{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.crow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;cursor:pointer;border:1px solid transparent}
.crow.sel{background:linear-gradient(110deg,#4c1fb033,#2a1a5233);border-color:#6d3de0}
.cm{flex:1;min-width:0}.cm .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{display:flex;flex-direction:column;gap:4px;align-items:flex-end}.cnt{background:#4c1fb0;border-radius:99px;padding:2px 10px;font-size:12px}
.dot2{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b6785}.dot2.on{background:#22c55e}
.tdesc2{margin:14px 0;color:#e6dcff;line-height:1.5}
.perks{display:grid;gap:10px;margin-bottom:16px}.pk{display:flex;gap:12px;align-items:center}
.pk i{width:24px;height:24px;border-radius:50%;background:#6d3de0;display:grid;place-items:center;flex:none}.pk .ic{width:14px;height:14px}
.tbig{width:100%;padding:15px;border-radius:14px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700}
.mk2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.mc2 .big{font-size:26px;font-weight:800;margin:6px 0}
.soonic{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#4c1fb0,#7c3aed);display:grid;place-items:center;margin:auto}.soonic .ic{width:30px;height:30px}
.seg .L2.on{background:var(--v);color:#fff}
@media(max-width:799px){
#app.on{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
.top{padding:10px 12px 4px;gap:10px}.top .sp{display:none}.srch input{padding:11px 12px 11px 42px}
.mmenu{right:12px;top:58px}
body.inchat .top,body.kb .top{display:none}
.tlow{grid-template-columns:1fr}
.thero{padding:20px;flex-direction:column;align-items:flex-start;min-height:0}.thero::before{opacity:.3}
.capsvg{width:64px}.tht h1{font-size:28px}
.cw{height:auto}
.bnav .nb{padding:8px 2px;font-size:11px}
}
